<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Envoi">
  <meta name="theme-color" content="#ffffff">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
    input, button { width: 100%; font-size: 16px; padding: 12px; margin-top: 12px; box-sizing: border-box; }
    #message { margin-top: 12px; color: green; }
  </style>
</head>
<body>
  <h1>Adresses de destination</h1>
  <input id="adresse1" type="email" placeholder="Adresse 1">
  <input id="adresse2" type="email" placeholder="Adresse 2">
  <button id="enregistrer">Enregistrer</button>
  <div id="message"></div>
  <p><a href="envoi.html">← Retour</a></p>

  <script>
    const champ1 = document.getElementById("adresse1");
    const champ2 = document.getElementById("adresse2");

    // Au chargement : on relit ce qui est dans le tiroir
    champ1.value = localStorage.getItem("adresse1") || "";
    champ2.value = localStorage.getItem("adresse2") || "";

    document.getElementById("enregistrer").onclick = function () {
      localStorage.setItem("adresse1", champ1.value.trim());
      localStorage.setItem("adresse2", champ2.value.trim());
      document.getElementById("message").textContent = "Enregistré ✔";
    };
  </script>
</body>
</html>
